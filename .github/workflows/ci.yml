name: Workleave CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: workleave_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U test -d workleave_test" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: sqlite://
      TEST_DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/workleave_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -e './backend[dev]' pip-audit
      - run: ruff check backend
      - run: pytest -q
        working-directory: backend
      - run: alembic upgrade head && alembic check
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/workleave_test
      - run: pip-audit
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
        working-directory: frontend
      - run: npm test && npm run build
        working-directory: frontend
      - run: npm audit --omit=dev --audit-level=high
        working-directory: frontend
  end-to-end:
    # Clerk is hosted. Enable this job only after linking the isolated test accounts below.
    if: ${{ vars.CLERK_E2E_ENABLED == 'true' }}
    env:
      VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
      CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
      CLERK_ISSUER: ${{ vars.CLERK_ISSUER }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_TEST_SECRET_KEY }}
      CLERK_SEED_EMPLOYEE_ID: ${{ vars.CLERK_SEED_EMPLOYEE_ID }}
      CLERK_SEED_MANAGER_ID: ${{ vars.CLERK_SEED_MANAGER_ID }}
      CLERK_SEED_HR_ID: ${{ vars.CLERK_SEED_HR_ID }}
      E2E_EMPLOYEE_EMAIL: ${{ vars.E2E_EMPLOYEE_EMAIL }}
      E2E_MANAGER_EMAIL: ${{ vars.E2E_MANAGER_EMAIL }}
      E2E_HR_EMAIL: ${{ vars.E2E_HR_EMAIL }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: cp .env.example .env
      - run: docker compose up -d --build --wait --wait-timeout 300
      - run: npm install && npx playwright install --with-deps chromium && npm test
        working-directory: e2e
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: playwright-results, path: e2e/playwright-report, if-no-files-found: ignore}
      - if: always()
        run: docker compose down -v
