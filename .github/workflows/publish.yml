name: Version and publish Docker images

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select image version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version_regex='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            release_tag="$GITHUB_REF_NAME"
            if [[ ! "$release_tag" =~ $version_regex ]]; then
              echo 'Release tags must be vMAJOR.MINOR.PATCH (for example v1.2.3).' >&2
              exit 1
            fi
            echo "version=${release_tag#v}" >> "$GITHUB_OUTPUT"
            echo 'create_tag=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          existing_tag="$(git tag --points-at "$GITHUB_SHA" | grep -E "$version_regex" | sort -V | tail -n 1 || true)"
          if [[ -n "$existing_tag" ]]; then
            release_tag="$existing_tag"
            create_tag=false
          else
            latest_tag="$(git tag --list 'v[0-9]*' | grep -E "$version_regex" | sort -V | tail -n 1 || true)"
            if [[ -z "$latest_tag" ]]; then
              release_tag='v0.1.0'
            else
              [[ "$latest_tag" =~ $version_regex ]]
              major="${BASH_REMATCH[1]}"
              minor="${BASH_REMATCH[2]}"
              patch="${BASH_REMATCH[3]}"
              release_tag="v${major}.${minor}.$((patch + 1))"
            fi
            create_tag=true
          fi

          echo "version=${release_tag#v}" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "create_tag=$create_tag" >> "$GITHUB_OUTPUT"

      - name: Create and push version tag
        if: steps.version.outputs.create_tag == 'true'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG"
          git push origin "$RELEASE_TAG"

      - name: Check frontend configuration
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
        run: test -n "$VITE_CLERK_PUBLISHABLE_KEY"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/backend.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: kaljo14/vcal-api:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/frontend.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: kaljo14/vcal-web:${{ steps.version.outputs.version }}
          build-args: VITE_CLERK_PUBLISHABLE_KEY=${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
